<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MiKS · Afro House</title>
<link rel="icon" type="image/png" href="media/favicon.png">
<link rel="apple-touch-icon" href="media/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --coffee:#161009;
    --coffee-2:#1f1710;
    --panel:#241a11;
    --bone:#f0e7d8;
    --sand:#cdb896;
    --mist:#8f8069;
    --clay:#c9552e;
    --ochre:#e09f3e;
    --gold:#f3c969;
    --moss:#9aa06a;
    --hair:rgba(224,159,62,.22);
    --hair-dim:rgba(224,159,62,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(ellipse 70% 50% at 18% 20%, rgba(201,85,46,.10), transparent 65%),
      radial-gradient(ellipse 60% 55% at 84% 75%, rgba(224,159,62,.08), transparent 65%),
      var(--coffee);
    color:var(--bone);
    font-family:'Sora',sans-serif;
    overflow-x:hidden;
  }
  .label{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--mist);font-weight:500;
  }

  /* ── video background: foggy, focusing near the cursor ── */
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--coffee)}
  #bg video{
    position:absolute;left:50%;top:50%;width:106%;height:106%;
    transform:translate(-50%,-50%);object-fit:cover;
  }
  #vFog{filter:blur(46px) brightness(.32) saturate(1.25)}
  #vFocus{
    filter:blur(18px) brightness(.55) saturate(1.25);
    -webkit-mask-image:radial-gradient(circle var(--fr,270px) at var(--fx,-999px) var(--fy,-999px),
      rgba(0,0,0,.95) 0%, rgba(0,0,0,.5) 48%, transparent 74%);
    mask-image:radial-gradient(circle var(--fr,270px) at var(--fx,-999px) var(--fy,-999px),
      rgba(0,0,0,.95) 0%, rgba(0,0,0,.5) 48%, transparent 74%);
  }
  #bg::after{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse 120% 100% at 50% 40%, transparent 55%, rgba(10,6,3,.75));}
  header,main,footer{position:relative;z-index:2}

  /* ── header: brand left, menu centered ────── */
  header{
    position:relative;display:flex;justify-content:center;align-items:center;
    padding:22px 42px 14px;
  }
  .brand{
    position:absolute;left:42px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:11px;cursor:pointer;transition:opacity .3s,transform .3s;
  }
  .brand:hover{opacity:1;transform:translateY(-50%) scale(1.08)}
  .brand img{height:30px;width:auto;opacity:.95}
  nav{display:flex;gap:30px}
  nav a{color:var(--mist);text-decoration:none;font-family:'IBM Plex Mono';
    font-size:10px;letter-spacing:.26em;transition:color .3s}
  nav a:hover,nav a.on{color:var(--gold)}

  /* ── the page: list left, stage right ─────── */
  main{
    display:grid;grid-template-columns:296px minmax(0,1fr);gap:0 34px;
    padding:8px 42px 22px;min-height:calc(100vh - 84px);
  }

  /* ── tracklist · liner notes ──────────────── */
  .list{display:flex;flex-direction:column;min-width:0;padding-top:6px}
  .tag{
    font-weight:200;font-size:26px;letter-spacing:.06em;line-height:1;
    text-transform:lowercase;color:var(--bone);text-shadow:0 2px 18px rgba(0,0,0,.6);
    margin-bottom:22px;
  }
  .tag b{font-weight:600;color:var(--gold)}
  .lab{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.28em;color:var(--mist);
    text-transform:uppercase;padding-bottom:9px;border-bottom:1px solid var(--hair-dim);
    display:flex;justify-content:space-between}
  .lab b{color:var(--ochre);font-weight:400}
  .tl{list-style:none;flex:1;max-height:calc(100vh - 230px);overflow-y:auto;padding:8px 0 4px;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
    scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
  .tl::-webkit-scrollbar{width:2px}
  .tl::-webkit-scrollbar-track{background:transparent}
  .tl::-webkit-scrollbar-thumb{background:var(--hair-dim)}
  .tl li{position:relative;display:grid;grid-template-columns:20px 1fr auto;align-items:baseline;
    gap:11px;padding:7px 6px 7px 12px;cursor:pointer;opacity:0;
    animation:tlIn .55s cubic-bezier(.22,.61,.36,1) forwards;transition:transform .28s ease;
    border-radius:4px}
  @keyframes tlIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
  .tl li::before{content:"";position:absolute;left:0;top:50%;width:0;height:1px;
    background:var(--hair);transform:translateY(-50%);transition:width .3s ease,background .3s ease}
  .tl .n{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.1em;color:var(--mist);
    transition:color .3s;font-variant-numeric:tabular-nums}
  .tl .t{font-size:13.5px;font-weight:300;line-height:1.3;color:var(--sand);transition:color .3s;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tl .b{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.08em;color:var(--mist);
    font-variant-numeric:tabular-nums;transition:color .3s}
  .tl .b i{font-style:normal;color:var(--mist);opacity:.7}
  .tl li:hover{transform:translateX(5px)}
  .tl li:hover::before{width:6px}
  .tl li:hover .t{color:var(--bone)}
  /* playing */
  .tl li.on::before{width:7px;background:var(--gold)}
  .tl li.on .t{color:var(--gold)}
  .tl li.on .n,.tl li.on .b{color:var(--ochre)}
  /* incoming: clay, with the fade filling behind the row */
  .tl li.in{background:linear-gradient(90deg,rgba(201,85,46,.22) var(--p,0%),rgba(201,85,46,.06) var(--p,0%))}
  .tl li.in::before{width:7px;background:var(--clay)}
  .tl li.in .t{color:#f0a37e}
  .tl li.in .n,.tl li.in .b{color:var(--clay)}
  .tl li.in.cued{animation:tlIn .55s forwards, cue 1s ease-in-out infinite}
  @keyframes cue{50%{background-color:rgba(201,85,46,.14)}}
  /* loading */
  .tl li.ld .t{color:var(--mist)}
  .tl li.ld .b::after{content:"…";color:var(--mist)}

  /* ── stage ────────────────────────────────── */
  .stage{display:flex;flex-direction:column;min-width:0;gap:10px}
  .viz{position:relative;flex:1;min-height:360px;border-radius:14px;overflow:hidden}
  .viz canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .viz .hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;pointer-events:none;
    font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--mist);
    transition:opacity .6s}
  .viz .hint.off{opacity:0}
  .status{
    display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;min-height:22px;
    font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mist);
    text-align:center;
  }
  .status b{color:var(--gold);font-weight:500}
  .status .in{color:#f0a37e}
  .status .free{color:var(--moss)}

  /* ── controls: play · wave · time / eq · volume ── */
  .controls{
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 16px;align-items:center;
    background:rgba(20,13,7,.62);border:1px solid var(--hair-dim);border-radius:14px;
    padding:14px 18px 14px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .play{
    width:54px;height:54px;border-radius:50%;border:1px solid var(--hair);cursor:pointer;
    background:linear-gradient(180deg,#2a1c0f,#1a1109);color:var(--gold);
    display:flex;align-items:center;justify-content:center;transition:transform .2s,background .3s;
  }
  .play:hover{transform:scale(1.06)}
  .play.on{background:linear-gradient(180deg,var(--gold),var(--ochre));color:#1a1006;border-color:transparent}
  .play svg{width:20px;height:20px;fill:currentColor}
  .play:disabled{opacity:.4;cursor:default;transform:none}
  .wave{position:relative;height:64px;border-radius:9px;overflow:hidden;cursor:pointer;touch-action:none;
    background:linear-gradient(180deg,#12100b,#0d0906);border:1px solid var(--hair-dim)}
  .wave canvas{position:absolute;inset:0;width:100%;height:100%}
  .wave .empty-note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.3em;color:var(--mist);pointer-events:none}
  .time{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.14em;color:var(--mist);
    font-variant-numeric:tabular-nums;white-space:nowrap;min-width:92px;text-align:right}
  .knobs{grid-column:2/4;display:flex;gap:22px;flex-wrap:wrap;align-items:center}
  .knob{display:flex;align-items:center;gap:9px;flex:1 1 120px;min-width:0}
  .knob .label{font-size:8.5px;letter-spacing:.2em;min-width:30px}
  .knob .val{font-family:'IBM Plex Mono';font-size:8.5px;color:var(--sand);min-width:36px;text-align:right;
    font-variant-numeric:tabular-nums}
  .knob input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:22px;background:transparent;cursor:pointer}
  .knob input::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:var(--hair)}
  .knob input::-moz-range-track{height:2px;border-radius:1px;background:var(--hair)}
  .knob input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;margin-top:-5px;
    background:var(--gold);border:1px solid #7e5a18;box-shadow:0 0 10px rgba(243,201,105,.35)}
  .knob input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--gold);border:1px solid #7e5a18}
  .knob.vol input::-webkit-slider-thumb{background:var(--bone)}
  .knob.vol input::-moz-range-thumb{background:var(--bone)}

  footer{padding:6px 0 22px;text-align:center}
  footer .label{font-size:9px}

  /* toast for honest errors */
  #toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#2a190c;border:1px solid var(--hair);border-radius:12px;color:var(--sand);
    font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.05em;padding:13px 22px;
    opacity:0;transition:all .4s;z-index:90;max-width:86vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%)}

  @media (max-width:1100px){
    main{grid-template-columns:240px minmax(0,1fr);gap:0 22px;padding:6px 24px 18px}
    .tag{font-size:22px}
  }
  @media (max-width:820px){
    main{grid-template-columns:minmax(0,1fr);gap:16px;min-height:0;padding:6px 16px 18px}
    .stage{order:1}
    .list{order:2}
    .viz{flex:none;height:44vh;min-height:230px}
    .tl{max-height:none;overflow:visible;-webkit-mask-image:none;mask-image:none}
    .tag{margin-bottom:14px}
    .controls{padding:12px}
    .knobs{grid-column:1/4}
    .time{min-width:0}
  }
  @media (max-width:700px){
    header{position:fixed;left:0;right:0;top:0;bottom:auto;justify-content:center;
      padding:8px 16px;background:rgba(18,12,7,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      border-bottom:1px solid var(--hair-dim);z-index:60}
    .brand{left:16px}
    .brand img{height:18px}
    nav{gap:12px;margin-left:96px}
    nav a{font-size:8px;letter-spacing:.1em}
    body{padding-top:46px}
    .viz{height:40vh;min-height:200px;border-radius:10px}
    .play{width:46px;height:46px}
    .wave{height:52px}
    .status{font-size:9px;letter-spacing:.22em}
  }
  @media (prefers-reduced-motion:reduce){
    .tl li{animation:none;opacity:1}
    .tl li.in.cued{animation:none}
  }
</style>
</head>
<body>

<div id="bg">
  <video id="vFog"   src="media/bg.mp4" muted loop playsinline autoplay></video>
  <video id="vFocus" src="media/bg.mp4" muted loop playsinline autoplay></video>
</div>

<header>
  <a class="brand" href="index.html" aria-label="MiKS home"><img src="media/logo.png" alt="MiKS"></a>
  <nav>
    <a href="index.html" class="on">HOME</a>
    <a href="music.html">MUSIC</a>
    <a href="tour.html">TOUR</a>
    <a href="projects.html">PROJECTS</a>
    <a href="#" onclick="return false">SHOP</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<main>
  <aside class="list" aria-label="Tracklist">
    <p class="tag"><b>me</b> &amp; <b>me</b></p>
    <div class="lab"><span>Tracklist · <b id="tlCount">—</b></span><span id="tlNote">beat-matched</span></div>
    <ol class="tl" id="tl"></ol>
  </aside>

  <section class="stage">
    <div class="viz" id="viz">
      <canvas id="inf"></canvas>
      <div class="hint" id="hint">pick a track · the next one mixes itself in</div>
    </div>
    <div class="status" id="status"></div>
    <div class="controls">
      <button class="play" id="play" aria-label="Play" disabled>
        <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
      </button>
      <div class="wave" id="wave"><canvas></canvas><div class="empty-note" id="waveNote">NO TRACK</div></div>
      <div class="time" id="time">0:00 / 0:00</div>
      <div class="knobs">
        <div class="knob"><span class="label">LOW</span><input type="range" id="eqLow" data-band="low" min="-26" max="6" value="0" step="1"><span class="val" id="eqLowV">0dB</span></div>
        <div class="knob"><span class="label">MID</span><input type="range" id="eqMid" data-band="mid" min="-26" max="6" value="0" step="1"><span class="val" id="eqMidV">0dB</span></div>
        <div class="knob"><span class="label">HIGH</span><input type="range" id="eqHigh" data-band="high" min="-26" max="6" value="0" step="1"><span class="val" id="eqHighV">0dB</span></div>
        <div class="knob vol"><span class="label">VOL</span><input type="range" id="vol" min="0" max="100" value="100" step="1"><span class="val" id="volV">100%</span></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <span class="label" style="font-size:8.5px">© MiKS · ALL BLENDS LIVE · ALL RIGHTS RESERVED</span>
</footer>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/shapes.js"></script>
<script src="js/figure.js"></script>
<script>
/* ═════════════════════════════ helpers ═════════════════════════════ */
const $=id=>document.getElementById(id);
const toastEl=$('toast');let toastT=null;
function toast(msg,ms=3800){toastEl.textContent=msg;toastEl.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),ms);}
function fmtTime(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0');}
MIKS.warn=toast;

/* ═══════════════════════════ the mixer ═══════════════════════════ */
const mixer=new MIKS.Mixer({fadeBeats:16,tempoWindow:0.08,autoAdvance:true});
/* iOS: the first tap anywhere claims the audio session and starts the
   context; every later tap re-resumes it if iOS interrupted it */
['touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>MIKS.unlock(ev),{passive:true}));

/* ?debug — a live readout of what the browser is doing with audio */
if(/[?&]debug/.test(location.search)){
  const box=document.createElement('pre');
  box.style.cssText='position:fixed;left:8px;bottom:8px;z-index:200;max-width:92vw;max-height:40vh;overflow:auto;margin:0;padding:8px 10px;background:rgba(0,0,0,.82);color:#9aa06a;font:10px/1.45 ui-monospace,Menlo,monospace;border:1px solid #444;border-radius:6px;white-space:pre-wrap';
  document.body.appendChild(box);
  const lines=[];
  MIKS.log=m=>{lines.push(new Date().toISOString().slice(11,19)+' '+m);if(lines.length>14)lines.shift();};
  addEventListener('error',e=>MIKS.log('ERR '+e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno));
  addEventListener('unhandledrejection',e=>MIKS.log('REJ '+(e.reason&&e.reason.message||e.reason)));
  MIKS.log('ua '+navigator.userAgent.replace(/Mozilla\/5.0 /,'').slice(0,90));
  MIKS.log('audioSession '+(navigator.audioSession?navigator.audioSession.type:'n/a')+' · iOS '+MIKS.isIOS+' · webgl '+!!document.createElement('canvas').getContext('webgl2'));
  setInterval(()=>{
    const m=mixer, a=MIKS.hasCtx()&&m.live?MIKS.master().audio():null;
    box.textContent='ctx '+MIKS.ctxState()+' · unlocked '+MIKS.unlocked()+' · playing '+m.playing+' · vol '+$('vol').value+'%\n'+
      'level '+(a?a.level.toFixed(3):'—')+' bass '+(a?a.bass.toFixed(3):'—')+' · t '+m.currentTime().toFixed(1)+'\n'+
      (m.live?('deck gain '+m.live.nodes.gain.gain.value.toFixed(2)+' · master vol '+MIKS.master().volume.gain.value.toFixed(2)+' · dest ch '+MIKS.ctx().destination.channelCount+'\n'):'')+
      lines.join('\n');
  },250);
}
let catalog=[];
window.MIKS.mixer=mixer;                       /* console / testing hook */
const inf=MIKS.figure($('inf'),{shape:'infinity'});

/* ═══ a shape per track — from the manifest, else by list position, and
   never the same as the row before so auto-advance always morphs ═══ */
function assignShapes(){
  const order=MIKS.SHAPE_ORDER, n=order.length;
  catalog.forEach((t,i)=>{ t.shapeName=(t.shape&&order.includes(t.shape))?t.shape:order[i%n]; t.shapeFixed=!!t.shape; });
  for(let i=1;i<catalog.length;i++){
    const t=catalog[i], prev=catalog[i-1].shapeName, next=catalog[i+1]?catalog[i+1].shapeName:null;
    if(!t.shapeFixed&&(t.shapeName===prev||t.shapeName===next))
      t.shapeName=order.find(s=>s!==prev&&s!==next)||t.shapeName;
  }
}

/* ═══ the list ═══ */
const tl=$('tl');
let rows=[];
function renderList(){
  tl.textContent=''; rows=[];
  catalog.forEach((t,i)=>{
    const li=document.createElement('li');
    li.style.animationDelay=(i*26)+'ms';
    const n=document.createElement('span'); n.className='n'; n.textContent=String(i+1).padStart(2,'0');
    const tt=document.createElement('span'); tt.className='t'; tt.textContent=t.title;
    const b=document.createElement('span'); b.className='b';
    li.append(n,tt,b);
    li.addEventListener('click',()=>mixer.select(t));
    tl.appendChild(li); rows.push(li);
  });
  $('tlCount').textContent=catalog.length;
  refreshMeta(); markList();
}
function refreshMeta(){
  catalog.forEach((t,i)=>{
    const b=rows[i].querySelector('.b');
    b.innerHTML=t.bpm?Math.round(t.bpm)+'<i> bpm</i>':(t.analysed?'<i>free mix</i>':'<i>—</i>');
    if(t.duration)b.innerHTML+=' <i>· '+fmtTime(t.duration)+'</i>';
  });
}
let loading=null;
function markList(){
  const cur=mixer.track, inc=mixer.incoming;
  const p=mixer.progress();
  rows.forEach((li,i)=>{
    const t=catalog[i];
    li.classList.toggle('on',t===cur);
    li.classList.toggle('in',t===inc);
    li.classList.toggle('cued',t===inc&&p<0);
    li.classList.toggle('ld',t===loading&&t!==cur&&t!==inc);
    if(t===inc)li.style.setProperty('--p',(Math.max(0,p)*100).toFixed(1)+'%');
    else li.style.removeProperty('--p');
  });
}

/* ═══ status line ═══ */
const statusEl=$('status'), hint=$('hint');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function refreshStatus(){
  const cur=mixer.track, inc=mixer.incoming, tr=mixer.transition;
  hint.classList.toggle('off',!!cur);
  if(!cur){statusEl.innerHTML='';return;}
  const bpm=mixer.bpm();
  let h=(mixer.playing?'now playing':'paused')+' · <b>'+esc(cur.title)+'</b>'+(bpm?' · '+Math.round(bpm)+' bpm':'');
  if(mixer.playing&&MIKS.ctxState()!=='running')h+=' &nbsp;·&nbsp; <span class="free">sound is off · tap play</span>';
  if(inc&&tr){
    const p=mixer.progress(), bars=Math.max(1,Math.round(mixer.fadeBeats/4));
    if(p<0)h+=' &nbsp;·&nbsp; <span class="in">cued · '+esc(inc.title)+' · on the next '+(tr.matched?'bar':'beat')+'</span>';
    else h+=' &nbsp;·&nbsp; <span class="in">mixing in · '+esc(inc.title)+' · bar '+Math.min(bars,Math.floor(p*bars)+1)+' of '+bars+'</span>'
          +(tr.matched?'':' <span class="free">· free mix</span>');
  }
  statusEl.innerHTML=h;
}

/* ═══ play button ═══ */
const ICO_PLAY='<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
const ICO_PAUSE='<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const playBtn=$('play');
playBtn.addEventListener('click',()=>mixer.toggle());
function refreshPlay(){
  const on=mixer.playing;
  playBtn.classList.toggle('on',on); playBtn.innerHTML=on?ICO_PAUSE:ICO_PLAY;
  playBtn.setAttribute('aria-label',on?'Pause':'Play');
  playBtn.disabled=!catalog.length;
}
addEventListener('keydown',e=>{
  if(e.code==='Space'&&!/INPUT|BUTTON|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();mixer.toggle();}
});

/* ═══ mixer events ═══ */
mixer.addEventListener('queue',e=>{loading=e.detail.track;markList();});
mixer.addEventListener('load',e=>{
  loading=null;
  const t=e.detail.track;
  if(!mixer.transition){ inf.setTone(t.tone); inf.morphTo(t.shapeName,{seconds:2.2}); }   /* cold start */
  $('waveNote').style.display='none';
  markList(); refreshStatus(); refreshPlay(); drawWave();
});
mixer.addEventListener('transition',e=>{loading=null;inf.morphTo(e.detail.track.shapeName);markList();refreshStatus();});
mixer.addEventListener('handoff',e=>{inf.commitMix(e.detail.to.tone);inf.commit();markList();refreshStatus();});
mixer.addEventListener('cancel',()=>{inf.setMix(null);inf.reverse();markList();refreshStatus();});
mixer.addEventListener('play',()=>{refreshPlay();MIKS.session(true);setMediaSession();});
mixer.addEventListener('pause',()=>{refreshPlay();MIKS.session(false);setMediaSession();});
mixer.addEventListener('ended',()=>{refreshPlay();refreshStatus();});
mixer.addEventListener('status',()=>{markList();refreshStatus();});
mixer.addEventListener('analysed',refreshMeta);

/* ═══ lock screen / headphone buttons ═══ */
function setMediaSession(){
  if(!('mediaSession' in navigator))return;
  const t=mixer.track;
  try{
    if(t)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:'MiKS',album:'me & me',
      artwork:[{src:'media/favicon.png',sizes:'512x512',type:'image/png'}]});
    navigator.mediaSession.playbackState=mixer.playing?'playing':'paused';
  }catch(e){}
}
if('mediaSession' in navigator){
  try{
    navigator.mediaSession.setActionHandler('play',()=>mixer.play());
    navigator.mediaSession.setActionHandler('pause',()=>mixer.pause());
    navigator.mediaSession.setActionHandler('nexttrack',()=>mixer.select(mixer.next()));
  }catch(e){}
}
mixer.addEventListener('load',setMediaSession);
mixer.addEventListener('handoff',setMediaSession);

/* ═══ EQ + volume — on the master, so they survive every handoff ═══ */
[['eqLow','low'],['eqMid','mid'],['eqHigh','high']].forEach(([id,band])=>{
  const sl=$(id);
  sl.addEventListener('input',()=>{
    MIKS.master().setEq(band,+sl.value);
    $(id+'V').textContent=(+sl.value>0?'+':'')+sl.value+'dB';
  });
});
$('vol').addEventListener('input',()=>{
  MIKS.master().setVolume(+$('vol').value/100);
  $('volV').textContent=$('vol').value+'%';
});

/* ═══ waveform: the playing track, seek by click or drag ═══ */
const wave=$('wave'), wcv=wave.querySelector('canvas');
function drawWave(){
  const w=wcv.clientWidth,h=wcv.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
  if(wcv.width!==Math.round(w*dpr)||wcv.height!==Math.round(h*dpr)){wcv.width=Math.round(w*dpr);wcv.height=Math.round(h*dpr);}
  const g=wcv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  const t=mixer.track;if(!t||!t.peaks)return;
  const n=t.peaks.length,played=mixer.currentTime()/t.duration*n;
  const tr=mixer.transition, p=mixer.progress();
  /* the stretch the fade covers, in the outgoing track */
  if(tr&&p>=0){
    const x0=(mixer.currentTime()-p*tr.fade)/t.duration*w, x1=x0+tr.fade/t.duration*w;
    g.fillStyle='rgba(201,85,46,.22)';g.fillRect(x0,0,x1-x0,h);
  }
  for(let i=0;i<n;i++){
    const x=i/n*w,ph=Math.max(2,t.peaks[i]*h*0.92);
    g.fillStyle=i<played?'#f3c969':'rgba(224,159,62,.32)';
    g.fillRect(x,(h-ph)/2,Math.max(1,w/n-0.6),ph);
  }
  const px=mixer.currentTime()/t.duration*w;
  g.fillStyle='#f0e7d8';g.fillRect(px-0.75,0,1.5,h);
}
let seeking=false;
const seekTo=e=>{
  if(!mixer.track)return;
  const r=wave.getBoundingClientRect();
  const x=Math.max(0,Math.min(1,((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width));
  mixer.seek(x*mixer.track.duration);
};
wave.addEventListener('pointerdown',e=>{seeking=true;seekTo(e);});
addEventListener('pointermove',e=>{if(seeking)seekTo(e);});
addEventListener('pointerup',()=>seeking=false);

/* ═══ the frame loop: tick the mixer, feed the infinity ═══ */
let lastSec=-1, lastP=-1;
let _stateT=0;
function raf(){
  mixer.tick();
  if(performance.now()-_stateT>1000){_stateT=performance.now();if(mixer.track)refreshStatus();}
  const t=mixer.track;
  if(t){
    drawWave();
    const sec=mixer.currentTime()|0;
    if(sec!==lastSec){lastSec=sec;$('time').textContent=fmtTime(sec)+' / '+fmtTime(t.duration);}
  }
  const tr=mixer.transition;
  if(tr){
    const p=mixer.progress();
    inf.setMix(p,tr.track.tone); inf.setMorph(p);
    if(Math.abs(p-lastP)>0.004){lastP=p;markList();refreshStatus();}
  }else if(lastP!==-1){lastP=-1;inf.setMix(null);}
  inf.setPlaying(mixer.playing);
  inf.setBeat(mixer.playing?mixer.beatPos():null);
  if(mixer.live){const a=MIKS.master().audio();inf.setAudio(a.level,a.bass,a.mid,a.high);}
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);
addEventListener('resize',()=>{drawWave();});

/* ═══════ video background — foggy everywhere, sharp near the cursor ═══════ */
(function(){
  const fog=$('vFog'), foc=$('vFocus');
  const tryPlay=()=>{if(fog.paused)fog.play().catch(()=>{});if(foc.paused)foc.play().catch(()=>{});};
  tryPlay();
  ['pointerdown','pointermove','touchstart','keydown','scroll'].forEach(ev=>
    addEventListener(ev,tryPlay,{passive:true}));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tryPlay();});
  setInterval(()=>{if(Math.abs(fog.currentTime-foc.currentTime)>0.08)foc.currentTime=fog.currentTime;},4000);
  let tx=-999,ty=-999,cx=-999,cy=-999;
  addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;});
  (function loop(){
    cx+=(tx-cx)*.14; cy+=(ty-cy)*.14;
    foc.style.setProperty('--fx',cx.toFixed(1)+'px');
    foc.style.setProperty('--fy',cy.toFixed(1)+'px');
    requestAnimationFrame(loop);
  })();
})();

/* ═══════ the catalogue — tracks/manifest.json, grid included ═══════ */
(async function load(){
  if(location.protocol==='file:'){toast('Serve over http:// so the catalogue can load.');return;}
  try{
    const r=await fetch('tracks/manifest.json',{cache:'no-cache'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    catalog=MIKS.catalogFromManifest(await r.json());
  }catch(e){toast('Could not load the catalogue — '+e.message);return;}
  assignShapes();
  mixer.setTracks(catalog);
  renderList(); refreshPlay();
  if(!catalog.some(t=>t.analysed))$('tlNote').textContent='analysing on play';
  /* warm the first track's bytes so the first tap is quick (decoding waits for the tap) */
  if(catalog[0])mixer.decode(catalog[0]).then(refreshMeta).catch(()=>{});
})();
</script>
