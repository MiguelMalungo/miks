<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiKS · Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --coffee:#161009;--bone:#f0e7d8;--sand:#cdb896;--mist:#8f8069;
    --gold:#f3c969;--ochre:#e09f3e;--clay:#c9552e;
    --hair:rgba(224,159,62,.22);--hair-dim:rgba(224,159,62,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{background:var(--coffee);color:var(--bone);font-family:'Sora',sans-serif;overflow:hidden}

  /* video backdrop — full home-page fog: heavy blur that sharpens inside a
     cursor-following circle. Swaps between per-track videos via two slots. */
  #bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0d0906}
  .slot{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
  .slot.on{opacity:1}
  .slot video{position:absolute;left:50%;top:50%;width:106%;height:106%;
    transform:translate(-50%,-50%);object-fit:cover}
  .vfog{filter:blur(46px) brightness(.32) saturate(1.25)}
  .vfocus{
    filter:blur(18px) brightness(.55) saturate(1.25);
    -webkit-mask-image:radial-gradient(circle var(--fr,270px) at var(--fx,-999px) var(--fy,-999px),
      rgba(0,0,0,.95) 0%, rgba(0,0,0,.5) 48%, transparent 74%);
    mask-image:radial-gradient(circle var(--fr,270px) at var(--fx,-999px) var(--fy,-999px),
      rgba(0,0,0,.95) 0%, rgba(0,0,0,.5) 48%, transparent 74%);
  }
  #bg::after{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse 120% 100% at 50% 42%, transparent 52%, rgba(10,6,3,.78));}
  header{position:relative;z-index:30}
  .stage,footer{position:relative;z-index:2}

  header{display:flex;justify-content:center;align-items:center;position:relative;padding:24px 42px 16px}
  .brand{position:absolute;left:42px;top:50%;transform:translateY(-50%);cursor:pointer;transition:transform .3s}
  .brand:hover{transform:translateY(-50%) scale(1.08)}
  .brand img{height:30px;opacity:.95}
  nav{display:flex;gap:30px}
  nav a{color:var(--mist);text-decoration:none;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.26em;transition:color .3s}
  nav a:hover,nav a.on{color:var(--gold)}

  /* the living blob, centred */
  .stage{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:calc(100vh - 92px);gap:0;
  }
  .orb{position:relative;width:min(86vh,88vw,860px);aspect-ratio:1}
  #blob{position:absolute;inset:-55%;width:210%;height:210%;cursor:pointer}
  .cue{text-align:center;margin-top:-11vh;pointer-events:none;user-select:none}
  .cue .k{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase}
  .cue h3{
    font-weight:200;font-size:clamp(34px,5vw,60px);letter-spacing:.01em;margin-top:8px;line-height:1;
    text-shadow:0 3px 22px rgba(0,0,0,.7);transition:opacity .4s;
  }
  .cue .sub{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.28em;color:var(--mist);
    text-transform:uppercase;margin-top:12px}

  footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:14px 0 22px;z-index:2}
  footer .m{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.28em;color:var(--mist);text-transform:uppercase}

  @media (max-width:700px){
    header{position:fixed;left:0;right:0;bottom:0;top:auto;justify-content:center;
      padding:8px 16px;background:rgba(18,12,7,.93);backdrop-filter:blur(10px);
      border-top:1px solid var(--hair-dim);z-index:60}
    .brand{left:16px}
    .brand img{height:22px}
    nav{gap:12px;margin-left:52px}
    nav a{font-size:8px;letter-spacing:.1em}
    footer{display:none}
    .stage{height:calc(100vh - 56px)}
    .orb{width:min(74vh,92vw,600px)}
  }
</style>
</head>
<body>

<div id="bg">
  <div class="slot on" id="slot0">
    <video class="vfog"   muted loop playsinline preload="auto"></video>
    <video class="vfocus" muted loop playsinline preload="auto"></video>
  </div>
  <div class="slot" id="slot1">
    <video class="vfog"   muted loop playsinline preload="auto"></video>
    <video class="vfocus" muted loop playsinline preload="auto"></video>
  </div>
</div>

<header>
  <a class="brand" href="index.html" aria-label="MiKS home"><img src="media/logo.png" alt="MiKS"></a>
  <nav>
    <a href="index.html">HOME</a>
    <a href="music.html" class="on">MUSIC</a>
    <a href="tour.html">TOUR</a>
    <a href="projects.html">PROJECTS</a>
    <a href="#" onclick="return false">SHOP</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<div class="stage">
  <div class="orb"><canvas id="blob"></canvas></div>
  <div class="cue">
    <div class="k">click the orb to hear</div>
    <h3 id="cueTitle">—</h3>
    <div class="sub" id="cueSub"></div>
  </div>
</div>

<footer><span class="m">© MiKS · all blends live · all rights reserved</span></footer>

<audio id="player" crossorigin="anonymous"></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ═══ new releases — each one paints the blob and swaps the backdrop ═══ */
const RELEASES=[
  {title:'HerPulse',   file:'tracks/HerPulse1.mp3',  tag:'Single · Afro House',
    tone:{main:0xf3c969, emis:0x5a4410, l1:0xfff6d8, l2:0xe0a83a}},   /* golden yellow */
  {title:'Moonlit',    file:'tracks/Moonlit.mp3',    tag:'Single · Deep',
    tone:{main:0xcdb896, emis:0x4a3d24, l1:0xf3ead2, l2:0xb39a6a}},   /* beige / sand */
  {title:'Sands',      file:'tracks/Sands.mp3',      tag:'Single · Desert House',
    tone:{main:0xe09f3e, emis:0x5a3808, l1:0xffe6b0, l2:0xc9772a}},   /* ochre / amber */
  {title:'Ocean',      file:'tracks/Ocean.mp3',      tag:'Single · Organic',
    tone:{main:0xe9dfc0, emis:0x585028, l1:0xfbf6e4, l2:0xc9b98a}},   /* cream */
  {title:'Ngiyavuma',  file:'tracks/Ngiyavuma.mp3',  tag:'Single · Amapiano',
    tone:{main:0xc9552e, emis:0x3a1206, l1:0xffcaa8, l2:0xe0673a}},   /* clay / terracotta */
  {title:'NightTemple',file:'tracks/NightTemple2.mp3',tag:'Single · Ritual',
    tone:{main:0xb5772a, emis:0x3a2408, l1:0xf0cf88, l2:0x9a5e1c}},   /* deep bronze */
];

/* ═══ backdrops — the home clip, then the three tour/bkg videos ═══ */
const BGS=['media/bg.mp4','media/bkgb.mp4','media/bkgc.mp4','media/bkgd.mp4'];
const slots=[document.getElementById('slot0'),document.getElementById('slot1')];
let front=0, curBg=-1;
const allVids=()=>[...document.querySelectorAll('#bg video')];
function playAll(){allVids().forEach(v=>{if(v.paused)v.play().catch(()=>{});});}
function setBg(i){
  i=((i%BGS.length)+BGS.length)%BGS.length;
  if(i===curBg)return; curBg=i;
  const src=BGS[i], back=slots[front^1], vids=[...back.querySelectorAll('video')];
  let ready=0, done=false;
  const swap=()=>{if(done)return; done=true;
    back.classList.add('on'); slots[front].classList.remove('on'); front^=1; playAll();};
  vids.forEach(v=>{
    v.onerror=()=>{if(v.getAttribute('src')!=='media/bg.mp4'){v.src='media/bg.mp4';v.load();}};
    v.oncanplay=()=>{v.oncanplay=null; if(++ready>=vids.length)swap();};
    v.src=src; v.load();
  });
  setTimeout(swap,1500);        /* safety: swap even if canplay is slow */
}
setBg(0);
['pointerdown','pointermove','touchstart','keydown'].forEach(e=>addEventListener(e,playAll,{passive:true,once:true}));

/* the focus circle follows the cursor (both slots stay in sync) */
let tx=-999,ty=-999,cx=-999,cy=-999;
addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;});
(function loop(){cx+=(tx-cx)*.14; cy+=(ty-cy)*.14;
  document.querySelectorAll('.vfocus').forEach(v=>{
    v.style.setProperty('--fx',cx.toFixed(1)+'px'); v.style.setProperty('--fy',cy.toFixed(1)+'px');});
  requestAnimationFrame(loop);})();

/* ═══ particle orb — a shell of points that breathes, collapses and
   scatters with the music and the cursor. The displacement runs in the
   vertex shader so ~45k points stay at 60fps; the palette is the same
   per-release tone the mesh blob used. ═══ */
const canvas=document.getElementById('blob');
let engine=null;
if(window.THREE){
  const SMALL=Math.min(innerWidth,innerHeight)<700||/Mobi|Android/i.test(navigator.userAgent);
  const ROWS=SMALL?140:215, COLS=SMALL?190:325, N=ROWS*COLS;

  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:false});
  const PIX=Math.min(devicePixelRatio||1,2);
  renderer.setPixelRatio(PIX);
  renderer.setClearColor(0x000000,0);
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(42,1,.1,14); cam.position.z=7;

  /* equal-area lat/long shell: rings stay legible (the striations you see
     when the noise is calm) but the poles don't clump */
  const pos=new Float32Array(N*3), rnd=new Float32Array(N), shell=new Float32Array(N);
  let k=0;
  for(let r=0;r<ROWS;r++){
    const y=1-2*(r+0.5)/ROWS, rad=Math.sqrt(Math.max(0,1-y*y));
    const off=(r&1)*(Math.PI/COLS);
    for(let c=0;c<COLS;c++){
      const phi=(c/COLS)*Math.PI*2+off;
      pos[k*3]=Math.cos(phi)*rad; pos[k*3+1]=y; pos[k*3+2]=Math.sin(phi)*rad;
      rnd[k]=Math.random(); shell[k]=Math.random();
      k++;
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aRand',new THREE.BufferAttribute(rnd,1));
  geo.setAttribute('aShell',new THREE.BufferAttribute(shell,1));

  const NOISE=`
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){
      const vec2 C=vec2(1.0/6.0,1.0/3.0);
      const vec4 D=vec4(0.0,0.5,1.0,2.0);
      vec3 i=floor(v+dot(v,C.yyy));
      vec3 x0=v-i+dot(i,C.xxx);
      vec3 g=step(x0.yzx,x0.xyz);
      vec3 l=1.0-g;
      vec3 i1=min(g.xyz,l.zxy);
      vec3 i2=max(g.xyz,l.zxy);
      vec3 x1=x0-i1+C.xxx;
      vec3 x2=x0-i2+C.yyy;
      vec3 x3=x0-D.yyy;
      i=mod289(i);
      vec4 p=permute(permute(permute(
          i.z+vec4(0.0,i1.z,i2.z,1.0))
        + i.y+vec4(0.0,i1.y,i2.y,1.0))
        + i.x+vec4(0.0,i1.x,i2.x,1.0));
      float n_=0.142857142857;
      vec3 ns=n_*D.wyz-D.xzx;
      vec4 j=p-49.0*floor(p*ns.z*ns.z);
      vec4 x_=floor(j*ns.z);
      vec4 y_=floor(j-7.0*x_);
      vec4 x=x_*ns.x+ns.yyyy;
      vec4 y=y_*ns.x+ns.yyyy;
      vec4 h=1.0-abs(x)-abs(y);
      vec4 b0=vec4(x.xy,y.xy);
      vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.0+1.0;
      vec4 s1=floor(b1)*2.0+1.0;
      vec4 sh=-step(h,vec4(0.0));
      vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
      vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x);
      vec3 p1=vec3(a0.zw,h.y);
      vec3 p2=vec3(a1.xy,h.z);
      vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
      p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
      vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
      m=m*m;
      return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }
    float fbm(vec3 p){
      /* two wide octaves — big rounded lobes, none of the fine filament fizz */
      return snoise(p)*0.72+snoise(p*2.03)*0.28;
    }`;

  const uni={
    uTime:{value:0}, uSpeed:{value:0.4}, uAmp:{value:0.1}, uSuction:{value:0.22},
    uLevel:{value:0}, uBass:{value:0}, uHigh:{value:0},
    uHover:{value:0}, uExc:{value:0}, uPtr:{value:new THREE.Vector3(0,0,1)},
    uSize:{value:SMALL?7.5:8.5}, uPix:{value:PIX},
    uColA:{value:new THREE.Color(0xc9a233)}, uColB:{value:new THREE.Color(0xfff3cf)}
  };

  const mat=new THREE.ShaderMaterial({
    uniforms:uni, transparent:true, depthWrite:false,
    blending:THREE.AdditiveBlending,
    vertexShader:NOISE+`
      uniform float uTime,uSpeed,uAmp,uSuction,uLevel,uBass,uHigh,uHover,uExc,uSize,uPix;
      uniform vec3 uPtr;
      attribute float aRand;
      attribute float aShell;
      varying float vGlow;
      void main(){
        vec3 dir=normalize(position);
        float t=uTime*uSpeed;
        float n=fbm(dir*1.45+vec3(0.0,t*0.5,t*0.3));
        /* suction hollows the shell where the noise dips — kept shallow so the
           clusters stay round instead of tearing into wisps */
        float suck=uSuction*smoothstep(0.15,-0.75,n);
        float amp=uAmp*(0.6+uBass*0.5);
        float r=1.0+amp*n-suck*0.45+aShell*0.05;
        /* the cursor pushes a bulge out of the surface */
        float d=dot(dir,uPtr);
        float bulge=smoothstep(0.45,1.0,d)*uHover*(0.20+uExc*0.55);
        r+=bulge;
        /* the music breathes the whole shell in and out — a uniform scale, so
           it stays spherical however loud it gets. Highs only brighten now;
           driving them into the geometry is what made it fizz. */
        r*=1.0+uLevel*0.16;
        vec3 p=dir*r;
        vGlow=clamp(0.3+n*0.5+bulge*2.0+uLevel*0.5+uHigh*0.35,0.0,1.7);
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_Position=projectionMatrix*mv;
        gl_PointSize=uSize*uPix*(0.55+aRand*0.75)/max(0.35,-mv.z);
      }`,
    fragmentShader:`
      precision mediump float;
      uniform vec3 uColA,uColB;
      varying float vGlow;
      void main(){
        vec2 c=gl_PointCoord-0.5;
        float d2=dot(c,c);
        if(d2>0.25)discard;
        float a=smoothstep(0.25,0.02,d2);
        vec3 col=mix(uColA,uColB,clamp(vGlow*0.55,0.0,1.0));
        gl_FragColor=vec4(col,a*(0.22+vGlow*0.55));
      }`
  });

  const pts=new THREE.Points(geo,mat); scene.add(pts);

  const tgtA=new THREE.Color(0xc9a233), tgtB=new THREE.Color(0xfff3cf);
  let hover=0,hT=0,mx=0,my=0,exc=0;
  let level=0,bass=0,mid=0,high=0;          /* smoothed audio */
  let lvT=0,bsT=0,mdT=0,hiT=0;              /* raw targets */

  canvas.addEventListener('pointerenter',()=>hT=1);
  canvas.addEventListener('pointerleave',()=>hT=0);
  canvas.addEventListener('pointermove',e=>{
    const r=canvas.getBoundingClientRect();
    const nx=(e.clientX-r.left)/r.width*2-1, ny=-((e.clientY-r.top)/r.height*2-1);
    exc=Math.min(1,exc+Math.hypot(nx-mx,ny-my)*1.4); mx=nx; my=ny; hT=1;
  });
  canvas.addEventListener('touchmove',e=>{
    const tch=e.touches[0]; if(!tch)return;
    const r=canvas.getBoundingClientRect();
    const nx=(tch.clientX-r.left)/r.width*2-1, ny=-((tch.clientY-r.top)/r.height*2-1);
    exc=Math.min(1,exc+Math.hypot(nx-mx,ny-my)*1.6); mx=nx; my=ny; hT=1;
  },{passive:true});
  canvas.addEventListener('touchend',()=>hT=0);

  function resize(){
    const r=canvas.parentElement.getBoundingClientRect();
    const w=Math.max(2,r.width), h=Math.max(2,r.height);
    renderer.setSize(w,h,false);
    cam.aspect=w/h; cam.updateProjectionMatrix();
  }
  resize(); addEventListener('resize',resize);

  const q=new THREE.Quaternion(), ptr=new THREE.Vector3();
  engine={
    setTone(t){ tgtA.setHex(t.main); tgtB.setHex(t.l1); },
    setLevel(l){ lvT=l; },
    setAudio(l,b,m,h){ lvT=l; bsT=b; mdT=m; hiT=h; },
    frame(t){
      hover+=(hT-hover)*0.05; exc*=0.965;
      /* long glides both ways — the shell drifts with the music rather than
         snapping at every transient, which is what read as erratic */
      level+=(lvT-level)*(lvT>level?0.10:0.05);
      bass +=(bsT-bass )*(bsT>bass ?0.12:0.05);
      mid  +=(mdT-mid  )*(mdT>mid  ?0.08:0.05);
      high +=(hiT-high )*(hiT>high ?0.10:0.06);

      uni.uColA.value.lerp(tgtA,0.04);
      uni.uColB.value.lerp(tgtB,0.04);

      uni.uTime.value=t;
      uni.uSpeed.value=0.30+level*0.18;
      uni.uAmp.value=0.085+level*0.10+exc*0.22+hover*0.05;
      uni.uSuction.value=0.20+mid*0.15;
      uni.uLevel.value=level; uni.uBass.value=bass; uni.uHigh.value=high;
      uni.uHover.value=hover; uni.uExc.value=exc;

      pts.rotation.y=t*(0.09-hover*0.05);
      pts.rotation.x=Math.sin(t*0.07)*0.14;
      q.copy(pts.quaternion).invert();
      ptr.set(mx,my,0.85).normalize().applyQuaternion(q);
      uni.uPtr.value.copy(ptr);

      renderer.render(scene,cam);
    }
  };
  (function loop(ts){engine.frame((ts||0)*0.001);requestAnimationFrame(loop);})();
}

/* ═══ audio — one track at a time; click the orb to advance ═══ */
const player=document.getElementById('player');
let AC=null,analyser=null,vuData=null;
function ensureGraph(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const srcNode=AC.createMediaElementSource(player);
  analyser=AC.createAnalyser(); analyser.fftSize=256;
  srcNode.connect(analyser); analyser.connect(AC.destination);
  vuData=new Uint8Array(analyser.frequencyBinCount);
  (function lvl(){
    if(analyser){
      analyser.getByteFrequencyData(vuData);
      const n=vuData.length;                       /* 128 bins ~ 172Hz each */
      const band=(a,b)=>{let t=0;for(let i=a;i<b;i++)t+=vuData[i];return t/(b-a)/255;};
      let s=0;for(let i=0;i<n;i++)s+=vuData[i];
      const on=!player.paused;
      if(engine)engine.setAudio(
        on?s/n/255:0,                              /* level  */
        on?band(1,7):0,                            /* bass — drives the burst */
        on?band(7,30):0,                           /* mid  — drives the suction */
        on?band(30,Math.min(90,n)):0);             /* highs — fine shimmer */
    }
    requestAnimationFrame(lvl);
  })();
}

const cueTitle=document.getElementById('cueTitle'), cueSub=document.getElementById('cueSub');
const cueK=document.querySelector('.cue .k');
let nextIdx=0, playing=-1;

function showCue(){                 /* the track a click will play next */
  const r=RELEASES[nextIdx];
  cueTitle.style.opacity=0;
  setTimeout(()=>{
    cueTitle.textContent=r.title;
    cueSub.textContent=r.tag;
    cueTitle.style.opacity=1;
  },160);
}
function playNext(){
  ensureGraph(); if(AC.state==='suspended')AC.resume();
  const i=nextIdx, r=RELEASES[i];
  playing=i;
  player.src=r.file; player.play().catch(()=>{});
  if(engine)engine.setTone(r.tone);
  setBg(i+1);                       /* default bg is "home"; each track shifts it */
  cueK.textContent='now playing · '+r.title.toLowerCase()+' — click for next';
  nextIdx=(i+1)%RELEASES.length;
  showCue();
}
canvas.addEventListener('click',playNext);
player.addEventListener('ended',playNext);   /* auto-advance */
showCue();                                    /* cue the first release */
</script>
</body>
</html>
